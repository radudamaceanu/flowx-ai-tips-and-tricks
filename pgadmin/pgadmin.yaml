# pgAdmin 4 for a FlowX dev env namespace. Applied by deploy.sh, which fills the __PLACEHOLDERS__.
# No PVC: settings and saved queries live in an emptyDir and are lost when the pod restarts.
# Login password: Secret pgadmin-login (random, created by deploy.sh).
# DB password: read from the namespace's existing Postgres secret into a pgpass file at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  labels: {app: pgadmin}
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "__SERVER_NAME__",
          "Group": "Servers",
          "Host": "__PG_SERVICE__",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "__PG_USER__",
          "SSLMode": "prefer",
          "PassFile": "/pgpass"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels: {app: pgadmin}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgadmin}
  template:
    metadata:
      labels: {app: pgadmin}
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
      initContainers:
        # Writes the pgpass file into the storage dir of the login user (admin@flowx.ai -> admin_flowx.ai).
        - name: pgpass
          image: dpage/pgadmin4:8.14
          command: ["/bin/sh", "-c"]
          args:
            - |
              umask 077
              d=/var/lib/pgadmin/storage/admin_flowx.ai
              mkdir -p "$d"
              printf '__PG_SERVICE__:5432:*:__PG_USER__:%s\n' "$PGPASS" > "$d/pgpass"
          env:
            - name: PGPASS
              valueFrom:
                secretKeyRef: {name: __PG_SECRET__, key: __PG_KEY__}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgadmin}
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:8.14
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PGADMIN_LISTEN_PORT, value: "8080"}
            - {name: PGADMIN_DEFAULT_EMAIL, value: admin@flowx.ai}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef: {name: pgadmin-login, key: password}
            - {name: PGADMIN_SERVER_JSON_FILE, value: /pgadmin4/servers.json}
            - {name: PGADMIN_DISABLE_POSTFIX, value: "true"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgadmin}
            - {name: servers, mountPath: /pgadmin4/servers.json, subPath: servers.json}
          readinessProbe:
            httpGet: {path: /misc/ping, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          emptyDir: {}
        - name: servers
          configMap: {name: pgadmin-servers}
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels: {app: pgadmin}
spec:
  selector: {app: pgadmin}
  ports:
    - {name: http, port: 8080, targetPort: http}
